<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#0E121B; --muted:#525866; --soft:#99A0AE; --line:#E1E4EA;
  --accent:#335CFF; --accent-ink:#FFFFFF; --accent-soft:rgba(51,92,255,.10);
  --hi:#FFD268; --hi-ink:#0E121B; --stage:#F5F7FA; --stage-2:#EBEDF2; --danger:#FB3748; --ok:#1FC16B;
  --shadow-xs:0 1px 2px rgba(10,13,20,.04);
  --shadow-sm:0 2px 4px rgba(27,28,29,.04),0 1px 1px rgba(10,13,20,.03);
  --shadow-md:0 16px 32px -12px rgba(14,18,27,.10);
  --sans:"Instrument Sans","DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E121B; --surface:#181B25; --ink:#FFFFFF; --muted:#99A0AE; --soft:#717784; --line:#2B303B;
    --accent:#5A7BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(90,123,255,.16);
    --stage:#10141D; --stage-2:#232730; --danger:#FF6875; --ok:#3EE089;
    --shadow-xs:0 1px 2px rgba(0,0,0,.3); --shadow-sm:0 2px 4px rgba(0,0,0,.3); --shadow-md:0 16px 32px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E121B; --surface:#181B25; --ink:#FFFFFF; --muted:#99A0AE; --soft:#717784; --line:#2B303B;
  --accent:#5A7BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(90,123,255,.16);
  --stage:#10141D; --stage-2:#232730; --danger:#FF6875; --ok:#3EE089;
  --shadow-xs:0 1px 2px rgba(0,0,0,.3); --shadow-sm:0 2px 4px rgba(0,0,0,.3); --shadow-md:0 16px 32px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--hi);color:var(--hi-ink)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
code{font-family:var(--mono)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}

/* top bar */
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.9rem;padding:6px 10px 6px 6px;border-radius:9px}
.back:hover{background:var(--stage);color:var(--ink)}
.back svg{width:18px;height:18px}
.bar .div{width:1px;height:22px;background:var(--line)}
.title{display:flex;align-items:center;gap:10px;margin:0;font-weight:650;font-size:1rem;letter-spacing:-.01em}
.title svg{width:20px;height:20px}
.bar .sp{flex:1}
.theme{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--stage);border:1px solid var(--line)}
.theme button{width:32px;height:28px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--soft);cursor:pointer}
.theme button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}
.theme svg{width:16px;height:16px}
@media (max-width:480px){.bar{gap:8px;padding:10px 12px}.bar .div{display:none}.back{font-size:0;gap:0;padding:6px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1px var(--accent),0 1px 2px rgba(14,18,27,.24);white-space:nowrap;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),var(--shadow-xs)}
.btn.ghost:hover{background:var(--stage)}
.btn[disabled]{background:var(--stage-2);color:var(--soft);box-shadow:none;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:.82rem;border-radius:8px}
.seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--stage);border:1px solid var(--line)}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:.84rem;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}
.seg small{font-size:.74rem;font-weight:600;color:var(--soft)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.76rem;font-weight:600;color:var(--muted)}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:0}
.pane{min-height:0;padding:18px}
.ed-pane{display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.res-pane{overflow:auto;background:var(--stage);display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.app{height:auto;min-height:100%}.main{grid-template-columns:minmax(0,1fr)}.ed-pane{border-right:0;border-bottom:1px solid var(--line)}.res-pane{overflow:visible}.editor{flex:none;height:380px}}

/* editor */
.ed-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ed-head h2{margin:0;font-size:.95rem;font-weight:600}
.ed-head .count{margin-left:auto;font-size:.82rem;color:var(--muted)}
.editor{position:relative;flex:1;min-height:320px;display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow-xs)}
.editor:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gutter{position:relative;overflow:hidden;min-width:54px;background:var(--stage);border-right:1px solid var(--line);user-select:none;-webkit-user-select:none}
#gut{padding:12px 0;font:400 12px/20px var(--mono);color:var(--soft);text-align:right;will-change:transform}
#gut div{position:relative;height:20px;padding:0 10px 0 22px}
#gut i{position:absolute;left:8px;top:6px;width:8px;height:8px;border-radius:50%}
#gut .error{background:var(--danger)}#gut .warning{background:var(--hi)}#gut .tip{background:var(--accent)}
#src{display:block;width:100%;height:100%;margin:0;padding:12px 14px;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:400 13px/20px var(--mono);white-space:pre;overflow:auto;tab-size:2}
#src:focus-visible{outline:none}
#src::placeholder{color:var(--soft)}
.hint{margin:0;font-size:.8rem;color:var(--muted)}

/* results */
.note{margin:0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:.86rem}
.sum{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-xs)}
.sq{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font:650 1.25rem var(--sans);background:var(--stage-2);color:var(--muted)}
.sq.err{background:var(--danger);color:var(--accent-ink)}.sq.warn{background:var(--hi);color:var(--hi-ink)}.sq.ok{background:var(--ok);color:var(--hi-ink)}
.sum h2{margin:0;font-size:1rem;font-weight:600}
.sum p{margin:2px 0 0;font-size:.86rem;color:var(--muted)}
.sum .grow{flex:1;min-width:0}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.iss{position:relative;display:grid;gap:8px;padding:14px 14px 14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-xs)}
.iss::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--sev)}
.iss.error{--sev:var(--danger)}.iss.warning{--sev:var(--hi)}.iss.tip{--sev:var(--accent)}
.iss h3{margin:0;font:600 .95rem/1.35 var(--sans)}
.iss-meta{display:flex;align-items:center;gap:10px}
.stag{padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:600;background:color-mix(in srgb,var(--sev) 18%,transparent)}
.lnk{padding:0;border:0;background:none;color:var(--accent);font:500 .8rem var(--sans);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.iss p{margin:0;font-size:.88rem;color:var(--muted)}
.diff{margin:0;overflow:auto;border:1px solid var(--line);border-radius:8px;font:400 12px/1.65 var(--mono)}
.diff span{display:block;min-width:max-content;padding:0 10px;white-space:pre}
.diff .del{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.diff .ins{background:color-mix(in srgb,var(--ok) 15%,transparent)}
.iss-acts{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.iss-acts a{font-size:.82rem;color:var(--muted)}
.iss-acts a:hover{color:var(--accent)}
.empty{margin:0;padding:28px 12px;text-align:center;color:var(--muted);font-size:.9rem}
@media (hover:none){.btn.sm,.lnk,.iss-acts a{min-height:32px;display:inline-flex;align-items:center}.seg button{min-height:32px}}

/* bottom */
.foot{display:grid;gap:12px;padding:16px 18px;border-top:1px solid var(--line);background:var(--surface)}
.foot h2{margin:0;font-size:.84rem;font-weight:600;color:var(--muted)}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0}
.chips li{padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--stage);font-size:.78rem;font-weight:500;color:var(--muted)}
.chips b{font-weight:600;color:var(--ink);margin-right:4px}
.foot-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.foot-row p{margin:0 auto 0 0;font-size:.86rem;color:var(--muted)}
.foot-row .acts{display:flex;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);transform:translate(-50%,8px);padding:9px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font:500 .88rem/1.4 var(--sans);box-shadow:var(--shadow-md);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Cursory</a>
    <span class="div" aria-hidden="true"></span>
    <h1 class="title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2.5 19.5 11l-6.6 1.9L9.6 20z" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/></svg>Cursor Lint</h1>
    <span class="sp"></span>
    <div class="theme" role="radiogroup" aria-label="Color theme">
      <button type="button" role="radio" data-t="light" aria-label="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" role="radio" data-t="dark" aria-label="Dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></button>
    </div>
    <button class="btn ghost" type="button" id="sample">Load sample</button>
  </header>

  <main class="main">
    <section class="pane ed-pane" aria-labelledby="ed-title">
      <div class="ed-head">
        <h2 id="ed-title">Your code</h2>
        <span class="badge" id="lang">CSS</span>
        <span class="count" id="count">0 lines</span>
      </div>
      <div class="editor">
        <div class="gutter" aria-hidden="true"><div id="gut"></div></div>
        <textarea id="src" spellcheck="false" wrap="off" autocomplete="off" autocapitalize="off" aria-labelledby="ed-title" aria-describedby="ed-hint" placeholder="Paste your CSS or HTML here"></textarea>
      </div>
      <p class="hint" id="ed-hint">Tab inserts two spaces. Press Esc, then Tab, to move on.</p>
    </section>

    <section class="pane res-pane" aria-labelledby="sum-title">
      <p class="note" id="note" hidden></p>
      <div class="sum">
        <div class="sq" id="sq">0</div>
        <div class="grow" aria-live="polite"><h2 id="sum-title">Nothing to check yet</h2><p id="sum-text">Paste CSS or HTML, or load the sample.</p></div>
        <button class="btn" type="button" id="fixall" disabled>Fix all</button>
      </div>
      <div class="seg" id="filter" role="radiogroup" aria-label="Show issues">
        <button type="button" role="radio" aria-checked="true" data-f="all">All <small id="n-all">0</small></button>
        <button type="button" role="radio" aria-checked="false" data-f="error" tabindex="-1">Errors <small id="n-error">0</small></button>
        <button type="button" role="radio" aria-checked="false" data-f="warning" tabindex="-1">Warnings <small id="n-warning">0</small></button>
        <button type="button" role="radio" aria-checked="false" data-f="tip" tabindex="-1">Tips <small id="n-tip">0</small></button>
      </div>
      <ol class="issues" id="issues"></ol>
    </section>
  </main>

  <footer class="foot">
    <h2>Checked rules</h2>
    <ul class="chips" id="rules"></ul>
    <div class="foot-row">
      <p>Your code never leaves your browser.</p>
      <div class="acts">
        <button class="btn ghost" type="button" id="report">Copy report</button>
        <button class="btn ghost" type="button" id="share">Copy share link</button>
      </div>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { lint, fixAll, detect, previewFix, RULES } from './lint-engine.js';

const $ = (s, c = document) => c.querySelector(s), $$ = (s, c = document) => [...c.querySelectorAll(s)];
const root = document.documentElement, ta = $('#src'), gut = $('#gut');
const LINE_H = 20, SHARE_MAX = 20 * 1024;
const SAMPLE = `/* Paste your CSS or HTML here */
.btn { cursor: pointer; }
.btn:disabled { cursor: pointer; opacity: .5; }
.carousel { cursor: -webkit-grab; cursor: grab; }
.brush { cursor: url("brush.png") 4 28; }
.link { cursor: hand; }
.canvas { cursor: crosshar; }
body { cursor: pointer; }
.game { cursor: none; }

<div class="card" onclick="openCard()">Open project</div>
<button disabled class="cursor-pointer">Pay now</button>
`;
const SEV = { error: 'Error', warning: 'Warning', tip: 'Tip' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const counts = n => [['error', n.error], ['warning', n.warning], ['tip', n.tip]].filter(([, k]) => k).map(([w, k]) => plural(k, w)).join(', ');

/* theme */
const setTheme = t => { root.setAttribute('data-theme', t); $$('.theme button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.t === t))); try { localStorage.setItem('cursory-theme', t) } catch (_) {} };
setTheme(root.getAttribute('data-theme') || 'light');
$$('.theme button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.t)));

/* toast and clipboard */
const toastEl = $('#toast'); let toastT;
const toast = t => { toastEl.textContent = t; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2000) };
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t) { const x = document.createElement('textarea'); x.value = t; x.style.position = 'fixed'; x.style.opacity = '0'; document.body.appendChild(x); x.select(); try { document.execCommand('copy') } catch (_) {} x.remove() }

/* css-tree loads from a pinned CDN build; the page still works (with a message) if it can't */
let csstree = null;
try { csstree = await import('https://cdn.jsdelivr.net/npm/css-tree@2.3.1/dist/csstree.esm.js') } catch (_) {}
const opts = () => ({ csstree, DOMParser: window.DOMParser });

$('#rules').innerHTML = RULES.map(r => `<li title="${esc(r.rule)}"><b>${r.id}</b>${esc(r.label)}</li>`).join('');

/* state */
let issues = [], failed = '', filter = 'all', timer;

function run() {
  clearTimeout(timer);
  const code = ta.value, d = detect(code), lines = code ? code.split('\n').length : 0;
  $('#lang').textContent = code.trim() ? d.language : 'CSS or HTML';
  $('#count').textContent = plural(lines, 'line');
  $('#note').hidden = !d.note; $('#note').textContent = d.note || '';
  failed = '';
  if (!code.trim()) issues = [];
  else if (!csstree) { issues = []; failed = 'Couldn’t load the CSS parser. Check your connection, then reload the page.' }
  else { try { issues = lint(code, opts()) } catch (err) { issues = []; failed = 'Couldn’t check this code.'; console.error(err) } }
  render(code, lines);
}

function render(code, lines) {
  const n = { error: 0, warning: 0, tip: 0 }; issues.forEach(i => n[i.severity]++);
  const fixable = issues.filter(i => i.fix).length, total = issues.length;
  const sq = $('#sq'); sq.textContent = failed ? '!' : total; sq.className = 'sq' + (failed ? '' : !code.trim() ? '' : n.error ? ' err' : n.warning ? ' warn' : total ? '' : ' ok');
  $('#sum-title').textContent = failed ? 'Check failed' : !code.trim() ? 'Nothing to check yet' : total ? plural(total, 'issue') : 'No cursor mistakes found';
  $('#sum-text').textContent = failed || (!code.trim() ? 'Paste CSS or HTML, or load the sample.'
    : total ? `${counts(n)}. ${fixable === total ? (fixable === 1 ? 'It can' : 'All of them can') : fixable === 0 ? 'None can' : fixable + ' can'} be fixed automatically.`
    : 'Every cursor value here is valid and used well.');
  $('#fixall').disabled = !fixable;
  $('#n-all').textContent = total; ['error', 'warning', 'tip'].forEach(k => $('#n-' + k).textContent = n[k]);

  // Gutter: line numbers, plus one dot per line for its most severe issue.
  const worst = {}; const rank = { error: 3, warning: 2, tip: 1 };
  issues.forEach(i => { if (!worst[i.line] || rank[i.severity] > rank[worst[i.line]]) worst[i.line] = i.severity });
  let g = ''; for (let l = 1; l <= Math.max(lines, 1); l++) g += `<div>${worst[l] ? `<i class="${worst[l]}"></i>` : ''}${l}</div>`;
  gut.innerHTML = g; syncGutter();

  const shown = issues.map((i, idx) => [i, idx]).filter(([i]) => filter === 'all' || i.severity === filter);
  $('#issues').innerHTML = !code.trim() || failed ? '' : !shown.length ? `<li class="empty">${total ? 'No issues of this kind.' : 'Nothing to fix.'}</li>`
    : shown.map(([i, idx]) => {
      let diff = '';
      if (i.fix) { const p = previewFix(code, i.fix); diff = `<pre class="diff" aria-label="Change preview"><code>${p.before.map(l => `<span class="del">- ${esc(l)}</span>`).join('')}${p.after.map(l => `<span class="ins">+ ${esc(l)}</span>`).join('')}</code></pre>` }
      return `<li class="iss ${i.severity}"><h3>${esc(i.title)}</h3>
        <div class="iss-meta"><span class="stag">${SEV[i.severity]}</span><button class="lnk" type="button" data-line="${i.line}">Line ${i.line}</button></div>
        <p>${esc(i.message)}</p>${diff}
        <div class="iss-acts">${i.fix ? `<button class="btn sm" type="button" data-fix="${idx}">${esc(i.fix.label)}</button>` : ''}<a href="${esc(i.learnMore)}">Learn more</a></div></li>`;
    }).join('');
}

/* editor */
const syncGutter = () => { gut.style.transform = `translateY(${-ta.scrollTop}px)` };
ta.addEventListener('scroll', syncGutter);
ta.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 250) });

// Edits go through insertText so Cmd/Ctrl+Z can undo them.
function edit(start, end, text) {
  ta.focus({ preventScroll: true }); ta.setSelectionRange(start, end);
  let ok = false;
  try { ok = text ? document.execCommand('insertText', false, text) : document.execCommand('delete') } catch (_) {}
  if (!ok) ta.setRangeText(text, start, end, 'end');
}
// Replace only the part that changed, as one undo step.
function replaceAll(next) {
  const cur = ta.value; if (next === cur) return;
  let a = 0; while (a < cur.length && a < next.length && cur[a] === next[a]) a++;
  let b = 0; while (b < cur.length - a && b < next.length - a && cur[cur.length - 1 - b] === next[next.length - 1 - b]) b++;
  edit(a, cur.length - b, next.slice(a, next.length - b));
}
let escArmed = false;
ta.addEventListener('keydown', e => {
  if (e.key === 'Escape') { escArmed = true; return }
  if (e.key === 'Tab' && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey && !escArmed) { e.preventDefault(); edit(ta.selectionStart, ta.selectionEnd, '  ') }
  escArmed = false;
});

function gotoLine(n) {
  const lines = ta.value.split('\n'); let s = 0;
  for (let i = 0; i < n - 1 && i < lines.length; i++) s += lines[i].length + 1;
  ta.focus({ preventScroll: true }); ta.setSelectionRange(s, s + (lines[n - 1] || '').length);
  ta.scrollTop = Math.max(0, (n - 1) * LINE_H - ta.clientHeight / 2 + LINE_H); ta.scrollLeft = 0; syncGutter();
  const r = ta.getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) ta.scrollIntoView({ block: 'center' });
}

$('#issues').addEventListener('click', e => {
  const l = e.target.closest('[data-line]'); if (l) return gotoLine(+l.dataset.line);
  const f = e.target.closest('[data-fix]'); if (!f) return;
  const i = issues[+f.dataset.fix]; if (!i || !i.fix) return;
  edit(i.fix.start, i.fix.end, i.fix.text); run(); toast(`${i.fix.label === 'Fix' ? 'Fixed' : 'Done'}: ${i.title}. Press ${/Mac|iP/.test(navigator.platform) ? '⌘' : 'Ctrl'}+Z to undo.`);
});
$('#fixall').addEventListener('click', () => {
  if (!csstree) return;
  const before = issues.filter(i => i.fix).length;
  try { replaceAll(fixAll(ta.value, opts())) } catch (err) { console.error(err); return toast('Couldn’t fix this code.') }
  run(); toast(`Applied ${plural(before, 'fix')}.` + (issues.length ? ` ${plural(issues.length, 'issue')} left to review.` : ''));
});
$('#sample').addEventListener('click', () => { replaceAll(SAMPLE); run(); ta.scrollTop = 0; syncGutter() });

/* filter */
const setFilter = f => { filter = f; $$('#filter button').forEach(b => { const on = b.dataset.f === f; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1 }); render(ta.value, ta.value ? ta.value.split('\n').length : 0) };
$$('#filter button').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.f)));
$('#filter').addEventListener('keydown', e => {
  const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!d) return; e.preventDefault();
  const k = ['all', 'error', 'warning', 'tip'], n = k[(k.indexOf(filter) + d + 4) % 4]; setFilter(n); $(`#filter [data-f="${n}"]`).focus();
});

/* report and share */
// Tags in messages would render as HTML in Markdown, so show them as code.
const mdCode = t => t.replace(/<\/?[a-z][^>]*>/gi, m => '`' + m + '`');
$('#report').addEventListener('click', () => {
  const n = { error: 0, warning: 0, tip: 0 }; issues.forEach(i => n[i.severity]++);
  const md = ['## Cursor Lint report', '',
    issues.length ? `${counts(n)}.` : 'No cursor mistakes found.', '',
    ...issues.map((i, k) => `${k + 1}. **${SEV[i.severity]}**, line ${i.line}: ${mdCode(i.title)} (${i.id} \`${i.rule}\`)  \n    ${mdCode(i.message)}`),
    '', 'Checked with [Cursor Lint](https://aowshad.github.io/cursory/lint.html).'].join('\n');
  copyText(md).then(() => toast('Report copied as Markdown'));
});
const toB64 = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') };
const fromB64 = t => { const bin = atob(t.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))) };
$('#share').addEventListener('click', () => {
  const code = ta.value;
  if (!code.trim()) return toast('Add some code first.');
  if (new TextEncoder().encode(code).length > SHARE_MAX) return toast('This code is over 20 KB, which is too long for a link. Copy the report instead.');
  const url = location.href.split('#')[0] + '#code=' + toB64(code);
  try { history.replaceState(null, '', url) } catch (_) {}
  copyText(url).then(() => toast('Share link copied'));
});

/* start: code from a share link, if there is one */
if (location.hash.startsWith('#code=')) { try { ta.value = fromB64(location.hash.slice(6)) } catch (_) { toast('This share link is damaged, so the code couldn’t be loaded.') } }
run();
</script>
</body>
</html>
